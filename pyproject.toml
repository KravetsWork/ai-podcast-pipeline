[project]
name = "ai-podcast-pipeline"
version = "1.0.0"
description = "Turn text scripts into tagged MP3 podcast episodes with edge-tts and publish them to Telegram."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
podcast-pipeline = "podcast_pipeline.cli:run"

[tool.setuptools]
packages = ["podcast_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
